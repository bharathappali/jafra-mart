apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-search
  labels:
    app.kubernetes.io/name: catalog-search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-search
        app.kubernetes.io/part-of: jafra-mart
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-search
          image: quay.io/bharathappali/jafra-mart:v1-catalog-search
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jafra-mart-config
          env:
            - name: CONTAINER_NAME
              value: catalog-search
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: THUMB_DIR
              value: /data/thumbs
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: JAVA_OPTS
              value: "-Xms160m -Xmx160m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:NativeMemoryTracking=summary -XX:+EnableDynamicAgentLoading -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:uptime,level,tags -Duser.timezone=UTC -Dfile.encoding=UTF-8 -XX:+UseG1GC"
          resources:
            requests:
              cpu: "0.25"
              memory: 576Mi
            limits:
              cpu: "0.50"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: thumbs
              mountPath: /data/thumbs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: thumbs
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-search
spec:
  selector:
    app.kubernetes.io/name: catalog-search
  ports:
    - name: http
      port: 8080
      targetPort: http
