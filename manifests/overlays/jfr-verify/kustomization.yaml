apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jafra-mart
labels:
  - pairs:
      app.kubernetes.io/part-of: jafra-mart
    includeSelectors: false
resources:
  - ../../00-namespace.yaml
  - ../../01-config.yaml
  - ../../05-postgres.yaml
  - ../../10-catalog-search.yaml
  - ../../11-pricing.yaml
  - ../../12-inventory.yaml
  - ../../13-cart.yaml
  - ../../14-payments.yaml
  - ../../15-reports-worker.yaml
  - ../../16-recommendations.yaml
  - ../../17-orders.yaml
  - ../../18-storefront.yaml
  - ../../19-loadgen.yaml
patches:
  - target:
      kind: Deployment
      name: catalog-search
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-search
      spec:
        template:
          spec:
            containers:
              - name: catalog-search
                env:
                  - name: EXTRA_JAVA_OPTS
                    value: "-XX:StartFlightRecording=name=verify,settings=profile,filename=/tmp/verify-%t.jfr,dumponexit=true,maxsize=150m,+jdk.SafepointStateSynchronization#enabled=true,+jdk.SafepointLatency#enabled=true,+jdk.ClassLoad#enabled=true,+jdk.ClassLoad#threshold=0ms,+jdk.ClassUnload#enabled=true,+jdk.JavaExceptionThrow#enabled=true,+jdk.FileForce#threshold=0ms,+jdk.VirtualThreadPinned#threshold=20ms"
  - target:
      kind: Deployment
      name: pricing
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pricing
      spec:
        template:
          spec:
            containers:
              - name: pricing
