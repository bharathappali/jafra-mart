apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jafra-mart
labels:
  - pairs:
      app.kubernetes.io/part-of: jafra-mart
    includeSelectors: false
resources:
  - ../../00-namespace.yaml
  - ../../01-config.yaml
  - ../../05-postgres.yaml
  - ../../10-catalog-search.yaml
  - ../../11-pricing.yaml
  - ../../12-inventory.yaml
  - ../../13-cart.yaml
  - ../../14-payments.yaml
  - ../../15-reports-worker.yaml
  - ../../16-recommendations.yaml
  - ../../17-orders.yaml
  - ../../18-storefront.yaml
  - ../../19-loadgen.yaml
patches:
  - target:
      kind: Deployment
      name: catalog-search
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-search
        labels:
          jafra.io/enabled: "true"
          jafra.io/mode: "continuous"
        annotations:
          jafra.io/containers: "catalog-search"
          jafra.io/chunktime: "5s"
      spec:
        template:
          metadata:
            labels:
              jafra.io/enabled: "true"
              jafra.io/mode: "continuous"
            annotations:
              jafra.io/containers: "catalog-search"
              jafra.io/chunktime: "5s"
