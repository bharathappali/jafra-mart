apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: payments
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/part-of: jafra-mart
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payments
          image: quay.io/bharathappali/jafra-mart:v1-payments
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: jafra-mart-config
          env:
            - name: CONTAINER_NAME
              value: payments
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JAVA_OPTS
              value: "-Xms112m -Xmx112m -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:NativeMemoryTracking=summary -XX:+EnableDynamicAgentLoading -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:uptime,level,tags -Duser.timezone=UTC -Dfile.encoding=UTF-8 -XX:+UseZGC --enable-native-access=ALL-UNNAMED -Djdk.virtualThreadScheduler.parallelism=2 -Djdk.virtualThreadScheduler.maxPoolSize=2"
          resources:
            requests:
              cpu: "0.25"
              memory: 256Mi
            limits:
              cpu: "0.75"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
spec:
  selector:
    app.kubernetes.io/name: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
